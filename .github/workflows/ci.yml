name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.18.0', '22', '24', '26']
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Install kernel bundle acceptance tooling
        run: npm install --no-save --package-lock=false --ignore-scripts esbuild@0.28.2
      - name: Validate release notes
        shell: bash
        run: node scripts/release-notes.mjs "v$(node -p 'require("./package.json").version')" release-notes.md
      - name: Check source and tests
        run: npm run check
        env:
          BLOCK_BEAVER_REQUIRE_ESBUILD: '1'

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  platform:
    name: Platform (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Install kernel bundle acceptance tooling
        run: npm install --no-save --package-lock=false --ignore-scripts esbuild@0.28.2
      - name: Validate release notes
        shell: bash
        run: node scripts/release-notes.mjs "v$(node -p 'require("./package.json").version')" release-notes.md
      - name: Check source and tests
        run: npm run check
        env:
          BLOCK_BEAVER_REQUIRE_ESBUILD: '1'
