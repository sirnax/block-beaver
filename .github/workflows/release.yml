name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Verify tag, changelog, and main ancestry
        run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" release-notes.md && git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Check source and tests
        run: npm run check
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "Block Beaver $GITHUB_REF_NAME" --notes-file release-notes.md
