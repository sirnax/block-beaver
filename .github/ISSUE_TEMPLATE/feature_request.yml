name: Feature request
description: Suggest a focused improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: approach
    attributes:
      label: Proposed behavior
      description: Include how it fits the standalone architecture and existing graph or roadmap contracts.
    validations:
      required: true
